services:
  - type: web
    name: cephas-crm-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: CORS_ORIGIN
        sync: false
      - key: NEON_AUTH_JWKS_URL
        value: https://ep-solitary-rain-bdzyf7z9.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth/.well-known/jwks.json
      - key: NEON_AUTH_BASE_URL
        value: https://ep-solitary-rain-bdzyf7z9.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth
      - key: ZOHO_CAMPAIGNS_API_URL
        value: https://campaigns.zoho.com/api/v1.1
      - key: ZOHO_CAMPAIGNS_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: ZOHO_CAMPAIGNS_CLIENT_ID
        sync: false
      - key: ZOHO_CAMPAIGNS_CLIENT_SECRET
        sync: false
      - key: ZOHO_CAMPAIGNS_REFRESH_TOKEN
        sync: false
      - key: ZOHO_CAMPAIGNS_FROM_EMAIL
        sync: false
      - key: ZOHO_CAMPAIGNS_FROM_NAME
        value: Cephas CRM
      - key: ZOHO_CAMPAIGNS_TOPIC_ID
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_COUNTRY_CODE
        value: "234"
      - key: TERMII_CHANNEL
        value: generic
      - key: ZOHO_WHATSAPP_API_URL
        value: https://cpaas.zoho.com/v1.1/whatsapp
      - key: ZOHO_WHATSAPP_API_KEY
        sync: false
      - key: ZOHO_WHATSAPP_AGENT_ID
        sync: false
      - key: ZOHO_WHATSAPP_FROM
        sync: false
      - key: ZOHO_WHATSAPP_COUNTRY_CODE
        value: "234"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_BUCKET
        value: uploads
