services:
  - type: web
    name: cephas-crm-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: CORS_ORIGIN
        sync: false
      - key: ZOHO_CAMPAIGNS_API_URL
        value: https://campaigns.zoho.com/api/v1.1
      - key: ZOHO_CAMPAIGNS_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: ZOHO_CAMPAIGNS_CLIENT_ID
        sync: false
      - key: ZOHO_CAMPAIGNS_CLIENT_SECRET
        sync: false
      - key: ZOHO_CAMPAIGNS_REFRESH_TOKEN
        sync: false
      - key: ZOHO_CAMPAIGNS_FROM_EMAIL
        sync: false
      - key: ZOHO_CAMPAIGNS_FROM_NAME
        value: Cephas CRM
      - key: ZOHO_CAMPAIGNS_TOPIC_ID
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: NEON_STORAGE_BUCKET
        value: uploads
